<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 특산물 에이전트</title>
  <style>
    :root {
      --cream: #fff6e6;
      --brown: #4b2a24;
      --pink-d: #c2476b;
      --orange: #ffb347;
      --orange-d: #c25e00;
      --green-d: #2f6b4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--brown);
      background: linear-gradient(160deg, #ffe3ea, #fff1dc 55%, #ffd9a8);
    }
    .chat {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 640px;
      height: 100vh;
      padding: 12px;
      gap: 10px;
    }
    header {
      padding: 0.7rem 1rem;
      text-align: center;
      background: var(--cream);
      border: 3px solid var(--brown);
      border-radius: 16px;
      box-shadow: 4px 4px 0 rgba(75, 42, 36, 0.25);
    }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 0.2rem 0 0; font-size: 0.85rem; }

    #log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      background: var(--cream);
      border: 3px solid var(--brown);
      border-radius: 16px;
    }
    .row { display: flex; align-items: flex-end; gap: 8px; }
    .row.me { justify-content: flex-end; }
    .avatar { flex: none; font-size: 1.8rem; line-height: 1; }
    .bubble {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
      border: 3px solid var(--brown);
      border-radius: 16px;
      animation: pop 0.2s ease-out;
    }
    .row.bot .bubble { background: #fff; }
    .row.me .bubble { background: var(--orange); }
    .typing { color: #8a6a60; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } }

    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.7rem 1rem;
      font: inherit;
      color: var(--brown);
      background: #fff;
      border: 3px solid var(--brown);
      border-radius: 999px;
    }
    input:focus { outline: 3px solid var(--pink-d); outline-offset: 1px; }
    button {
      padding: 0 1.3rem;
      font: inherit;
      font-weight: bold;
      color: #fff;
      background: var(--orange-d);
      border: 3px solid var(--brown);
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover { background: var(--pink-d); }
    .fake { margin: 0; text-align: center; font-size: 0.75rem; color: #7a5a52; }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>제주 특산물 에이전트</h1>
      <p>제주도 특산물에 대해서 알아보는 기능</p>
    </header>

    <div id="log" aria-live="polite"></div>

    <form id="form" autocomplete="off">
      <input id="msg" type="text" placeholder="궁금한 제주 특산물을 물어보세요" aria-label="메시지 입력">
      <button type="submit">보내기</button>
    </form>

    <p class="fake">※ 지금 답변은 미리 정해 둔 가짜 답이에요.</p>
  </main>

  <script src="faq.js"></script>
  <script>
    // 미리 정해 둔 츤데레 대사(가짜 답). t = 말투 종류, 같은 말투가 연달아 나오지 않게 고른다
  var TOPICS = [
    { re: /안녕|하이|ㅎㅇ|반가/, list: [
      { t: 'huff', s: '왔어? 별로 기다린 건 아니야.' },
      { t: 'shy', s: '...안녕. 오늘은 늦지 않았네.' },
      { t: 'bossy', s: '용건부터 말해. 시간 아깝잖아.' } ] },
    { re: /바보|멍청|싫어|못생/, list: [
      { t: 'huff', s: '말 조심해. 그런 말에 흔들릴 내가 아니야.' },
      { t: 'bossy', s: '다시 말해 봐. 이번엔 정중하게.' },
      { t: 'shy', s: '...방금 말은 못 들은 걸로 해 줄게.' } ] },
    { re: /고마|좋아|최고|귀여|예뻐|이쁘/, list: [
      { t: 'shy', s: '칭찬해도 나올 건 없어.' },
      { t: 'huff', s: '당연한 걸 새삼스럽게.' },
      { t: 'proud', s: '알아봐 줬네. ...나쁘진 않아.' } ] }
  ];
  var ANY = [
    { t: 'huff', s: '그건 아직 공부 중이야. 5일차에 알려 줄게.' },
    { t: 'shy', s: '...그건 잘 몰라. 곧 알아낼 거니까 재촉하지 마.' },
    { t: 'bossy', s: '질문이 애매해. 감귤, 갈치, 흑돼지 중에 골라.' },
    { t: 'care', s: '너무 어려운 건 묻지 마. 5일차에 다시 와.' },
    { t: 'proud', s: '좋은 질문이야. 다만 아직 준비 중이야.' }
  ];
  var used = {};
  var lastTone = '';

  // 안 쓴 대사 중에서, 직전과 다른 말투를 우선해서 고른다
  function pick(list, backup) {
    var pool = list.filter(function (r) { return !used[r.s]; });
    if (!pool.length) { list.forEach(function (r) { delete used[r.s]; }); pool = list.slice(); }
    var diff = pool.filter(function (r) { return r.t !== lastTone; });
    if (!diff.length && backup) {
      diff = backup.filter(function (r) { return !used[r.s] && r.t !== lastTone; });
    }
    if (diff.length) pool = diff;
    var r = pool[Math.floor(Math.random() * pool.length)];
    used[r.s] = true;
    lastTone = r.t;
    return r.s;
  }

  // faq.js 에서 질문과 가장 많이 겹치는 항목을 찾는다 (비슷한 질문이면 같은 답)
  function findFaq(text) {
    var t = text.toLowerCase().replace(/\s+/g, '');
    var best = null, bestScore = 0;
    (window.FAQ || []).forEach(function (e) {
      var s = 0;
      e.keys.forEach(function (k) { if (t.indexOf(k.replace(/\s+/g, '')) > -1) s++; });
      if (s > bestScore) { bestScore = s; best = e; }
    });
    return best;
  }

  function reply(text) {
    var faq = findFaq(text);
    if (faq) { lastTone = 'faq'; return faq.a; }
    for (var i = 0; i < TOPICS.length; i++) {
      if (TOPICS[i].re.test(text)) return pick(TOPICS[i].list, ANY);
    }
    return pick(ANY);
  }
    const REPLY_DELAY = 1000;

    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('msg');

    function addRow(who, text) {
      const row = document.createElement('div');
      row.className = 'row ' + who;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      if (who === 'bot') {
        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        avatar.textContent = '🍊';
        row.append(avatar);
      }
      row.append(bubble);
      log.append(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addRow('me', text);
      input.value = '';

      const typing = addRow('bot', '…');
      typing.querySelector('.bubble').classList.add('typing');
      setTimeout(() => {
        typing.remove();
        addRow('bot', reply(text));
      }, REPLY_DELAY);
    });

    // 첫 인사
    addRow('bot', '특산물이 궁금해? 입력창에 쓰고 Enter 눌러. 딱히 도와주고 싶은 건 아니야.');
    input.focus();
  </script>
</body>
</html>
