<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 특산물 에이전트</title>
  <style>
    :root {
      --cream: #fff6e6;
      --brown: #4b2a24;
      --pink-d: #c2476b;
      --orange: #ffb347;
      --orange-d: #c25e00;
      --green-d: #2f6b4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--brown);
      background: linear-gradient(160deg, #ffe3ea, #fff1dc 55%, #ffd9a8);
    }
    .chat {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 640px;
      height: 100vh;
      padding: 12px;
      gap: 10px;
    }
    header {
      padding: 0.7rem 1rem;
      text-align: center;
      background: var(--cream);
      border: 3px solid var(--brown);
      border-radius: 16px;
      box-shadow: 4px 4px 0 rgba(75, 42, 36, 0.25);
    }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 0.2rem 0 0; font-size: 0.85rem; }

    #log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      background: var(--cream);
      border: 3px solid var(--brown);
      border-radius: 16px;
    }
    .row { display: flex; align-items: flex-end; gap: 8px; }
    .row.me { justify-content: flex-end; }
    .avatar { flex: none; font-size: 1.8rem; line-height: 1; }
    .bubble {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
      border: 3px solid var(--brown);
      border-radius: 16px;
      animation: pop 0.2s ease-out;
    }
    .row.bot .bubble { background: #fff; }
    .row.me .bubble { background: var(--orange); }
    .typing { color: #8a6a60; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } }

    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.7rem 1rem;
      font: inherit;
      color: var(--brown);
      background: #fff;
      border: 3px solid var(--brown);
      border-radius: 999px;
    }
    input:focus { outline: 3px solid var(--pink-d); outline-offset: 1px; }
    button {
      padding: 0 1.3rem;
      font: inherit;
      font-weight: bold;
      color: #fff;
      background: var(--orange-d);
      border: 3px solid var(--brown);
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover { background: var(--pink-d); }
    .fake { margin: 0; text-align: center; font-size: 0.75rem; color: #7a5a52; }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>제주 특산물 에이전트</h1>
      <p>제주도 특산물에 대해서 알아보는 기능</p>
    </header>

    <div id="log" aria-live="polite"></div>

    <form id="form" autocomplete="off">
      <input id="msg" type="text" placeholder="궁금한 제주 특산물을 물어보세요" aria-label="메시지 입력">
      <button type="submit">보내기</button>
    </form>

    <p class="fake">※ 지금 답변은 미리 정해 둔 가짜 답이에요.</p>
  </main>

  <script src="faq.js"></script>
  <script>
    // 미리 정해 둔 츤데레 대사(가짜 답). t = 말투 종류, 같은 말투가 연달아 나오지 않게 고른다
  var TOPICS = [
    { re: /안녕|하이|ㅎㅇ|반가/, list: [
      { t: 'huff', s: '뭐야, 인사부터? ...안녕. 별로 반가운 건 아니거든!' },
      { t: 'shy', s: '왔구나. 기다린 건 아닌데... 심심하진 않았어.' },
      { t: 'bossy', s: '왔으면 빨리 물어봐. 나도 바쁘거든!' } ] },
    { re: /바보|멍청|싫어|못생/, list: [
      { t: 'huff', s: '누가 바보야, 누가! 너나 잘해!' },
      { t: 'bossy', s: '말버릇 고쳐. 안 그러면 안 알려 줄 거야!' },
      { t: 'shy', s: '...그런 말 들으면 좀 속상하거든. 딱히 상처받은 건 아니지만!' } ] },
    { re: /고마|좋아|최고|귀여|예뻐|이쁘/, list: [
      { t: 'shy', s: '가, 갑자기 뭐야! 칭찬해도 아무것도 안 나와, 바보!' },
      { t: 'huff', s: '고마워할 필요 없어. 당연한 거니까... 흥!' },
      { t: 'proud', s: '내가 좀 대단하긴 하지. 인정해 줘서... 나쁘진 않네!' } ] },
    { re: /감귤|귤|한라봉|천혜향|레드향/, list: [
      { t: 'bossy', s: '감귤이면 겨울에 가. 직접 따 보면 맛이 달라, 알겠어?' },
      { t: 'shy', s: '한라봉이 제일 맛있어... 딱히 내가 좋아하는 건 아니고!' },
      { t: 'proud', s: '제주 감귤은 당도가 다르다고. 당연한 거지, 흥!' } ] },
    { re: /갈치|옥돔|생선|회/, list: [
      { t: 'proud', s: '은갈치는 반짝반짝한 게 신선한 거야. 그 정도는 알아 둬!' },
      { t: 'care', s: '갈치조림 먹을 땐 가시 조심해. 걱정돼서가 아니라 귀찮아져서 그래!' },
      { t: 'huff', s: '옥돔구이도 있거든? 갈치만 있는 줄 알았어? 흥!' } ] },
    { re: /흑돼지|돼지|고기|삼겹/, list: [
      { t: 'bossy', s: '흑돼지는 멜젓에 찍어 먹어. 이건 꼭 해 봐야 돼!' },
      { t: 'shy', s: '두툼하게 구운 근고기... 맛있긴 하더라. 딱히 먹고 싶은 건 아니야!' },
      { t: 'proud', s: '제주 흑돼지는 육즙이 달라. 내가 보증할게!' } ] },
    { re: /선물|기념|오메기|초콜릿|택배/, list: [
      { t: 'care', s: '선물이면 감귤 초콜릿이 가볍고 좋아. 받는 사람이 좋아하겠네... 부러운 건 아니야!' },
      { t: 'bossy', s: '오메기떡도 챙겨. 쫀득해서 인기 많으니까!' },
      { t: 'huff', s: '냉동 갈치는 택배로 보낼 수 있어. 그 정도도 몰랐어?' } ] },
    { re: /어디|사려|구매|시장|체험|놀|여행/, list: [
      { t: 'huff', s: '동문시장에 가 봐. 처음 가는 거면 길 잃지 말고!' },
      { t: 'care', s: '겨울엔 귤 따기 체험도 있어. 같이... 아니, 혼자 가도 재밌을 거야!' },
      { t: 'bossy', s: '체험은 예약해야 하는 곳이 많아. 미리미리 확인해!' } ] }
  ];
  var ANY = [
    { t: 'huff', s: '아직 공부 중이란 말이야! 5일차에 알려 줄 테니까 기다려, 바보!' },
    { t: 'shy', s: '그건... 아직 잘 몰라. 모른다고 말하는 거 싫은데... 곧 알아낼 거야!' },
    { t: 'bossy', s: '질문이 애매해! 감귤, 갈치, 흑돼지 중에 골라서 다시 물어봐.' },
    { t: 'care', s: '너무 어려운 건 묻지 마. 아직 공부 중이니까... 5일차에 다시 와!' },
    { t: 'proud', s: '나한테 물어본 건 잘한 선택이야. 다만 그건 아직 준비 중이지만!' }
  ];
  var used = {};
  var lastTone = '';

  // 안 쓴 대사 중에서, 직전과 다른 말투를 우선해서 고른다
  function pick(list, backup) {
    var pool = list.filter(function (r) { return !used[r.s]; });
    if (!pool.length) { list.forEach(function (r) { delete used[r.s]; }); pool = list.slice(); }
    var diff = pool.filter(function (r) { return r.t !== lastTone; });
    if (!diff.length && backup) {
      diff = backup.filter(function (r) { return !used[r.s] && r.t !== lastTone; });
    }
    if (diff.length) pool = diff;
    var r = pool[Math.floor(Math.random() * pool.length)];
    used[r.s] = true;
    lastTone = r.t;
    return r.s;
  }

  // faq.js 에서 질문과 가장 많이 겹치는 항목을 찾는다 (비슷한 질문이면 같은 답)
  function findFaq(text) {
    var t = text.toLowerCase().replace(/\s+/g, '');
    var best = null, bestScore = 0;
    (window.FAQ || []).forEach(function (e) {
      var s = 0;
      e.keys.forEach(function (k) { if (t.indexOf(k.replace(/\s+/g, '')) > -1) s++; });
      if (s > bestScore) { bestScore = s; best = e; }
    });
    return best;
  }

  function reply(text) {
    var faq = findFaq(text);
    if (faq) { lastTone = 'faq'; return faq.a; }
    for (var i = 0; i < TOPICS.length; i++) {
      if (TOPICS[i].re.test(text)) return pick(TOPICS[i].list, ANY);
    }
    return pick(ANY);
  }
    const REPLY_DELAY = 1000;

    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('msg');

    function addRow(who, text) {
      const row = document.createElement('div');
      row.className = 'row ' + who;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      if (who === 'bot') {
        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        avatar.textContent = '🍊';
        row.append(avatar);
      }
      row.append(bubble);
      log.append(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addRow('me', text);
      input.value = '';

      const typing = addRow('bot', '…');
      typing.querySelector('.bubble').classList.add('typing');
      setTimeout(() => {
        typing.remove();
        addRow('bot', reply(text));
      }, REPLY_DELAY);
    });

    // 첫 인사
    addRow('bot', '흥, 제주 특산물이 궁금해? 입력창에 쓰고 Enter 눌러. 딱히 도와주고 싶은 건 아니거든!');
    input.focus();
  </script>
</body>
</html>
