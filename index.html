<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 검색 슬라이드</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; font-family: sans-serif; background: #f4f8fb; color: #2b3a55; }
    main { max-width: 1000px; margin: 0 auto; }
    h1 { margin-top: 0; }
    form { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
    input { padding: 0.6rem; font-size: 1rem; border: 1px solid #aab; border-radius: 8px; }
    #q { flex: 1; min-width: 180px; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; border: 0; border-radius: 8px; color: #fff; background: #1c7ed6; }
    button:disabled { background: #aab; cursor: default; }
    #status { min-height: 1.5rem; margin: 0.5rem 0; }
    #status.error { color: #c62828; }

    /* 슬라이드: 한 화면에 10개(5열 x 2행) */
    .slider { display: flex; align-items: center; gap: 0.5rem; }
    .viewport { flex: 1; overflow: hidden; }
    .slide {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .slide.out-left  { animation: outLeft 0.25s forwards; }
    .slide.in-right  { animation: inRight 0.3s; }
    .slide.in-left   { animation: inLeft 0.3s; }
    @keyframes outLeft  { to { transform: translateX(-40px); opacity: 0; } }
    @keyframes inRight  { from { transform: translateX(60px); opacity: 0; } }
    @keyframes inLeft   { from { transform: translateX(-60px); opacity: 0; } }
    .slide a { display: block; position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 8px; background: #dde; }
    .slide img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
    .slide a:hover img { transform: scale(1.08); }
    .slide span {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 6px;
      font-size: 0.7rem; color: #fff; background: rgba(0, 0, 0, 0.55);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .arrow { width: 44px; height: 44px; padding: 0; font-size: 1.5rem; border-radius: 50%; }
    #page { text-align: center; margin-top: 0.75rem; }
    .credit { margin-top: 1rem; font-size: 0.8rem; color: #667; }
    @media (max-width: 700px) { .slide { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<main>
  <h1>🖼️ 이미지 검색 슬라이드</h1>

  <form id="form">
    <input id="q" type="text" placeholder="검색어 (예: 제주도, 감귤)" required>
    <button type="submit">검색</button>
  </form>
  <div id="status"></div>

  <div class="slider">
    <button id="prev" class="arrow" aria-label="이전 10개" disabled>‹</button>
    <div class="viewport"><div id="slide" class="slide"></div></div>
    <button id="next" class="arrow" aria-label="다음 10개" disabled>›</button>
  </div>
  <div id="page"></div>
  <p class="credit">Images from <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a></p>
</main>

<script>
  const PER_PAGE = 10;
  const qInput = document.getElementById('q');
  const statusEl = document.getElementById('status');
  const slideEl = document.getElementById('slide');
  const pageEl = document.getElementById('page');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  let query = '';
  let page = 1;
  let totalPages = 1;
  let loading = false;

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'error' : '';
  }

  async function load(newPage, direction) {
    if (loading) return;
    loading = true;
    prevBtn.disabled = nextBtn.disabled = true;
    setStatus('불러오는 중...');

    // API 키는 서버(/api/pixabay)가 환경변수로 들고 있으므로 브라우저에는 키가 없다.
    const url = '/api/pixabay?' + new URLSearchParams({ q: query, page: newPage });

    try {
      // 파일로 직접 열면 /api 주소를 찾을 수 없으므로 안내한다.
      if (!/^https?:$/.test(location.protocol)) {
        throw new Error('이 페이지는 Vercel에 배포한 주소(https://...vercel.app)나 `vercel dev` 로 열어야 검색할 수 있습니다.');
      }
      const res = await fetch(url);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = res.status === 429 ? '요청이 너무 많습니다. 잠시 후 다시 시도하세요.'
                  : data.error || '오류가 발생했습니다 (' + res.status + ')';
        throw new Error(msg);
      }
      if (!data.hits.length) {
        slideEl.replaceChildren();
        pageEl.textContent = '';
        setStatus('"' + query + '" 검색 결과가 없습니다.');
        return;
      }

      page = newPage;
      totalPages = Math.max(1, Math.ceil(data.totalHits / PER_PAGE));
      render(data.hits, direction);
      pageEl.textContent = page + ' / ' + totalPages + ' 페이지 (총 ' + data.totalHits + '장)';
      setStatus('');
    } catch (err) {
      setStatus(err.message || '불러오지 못했습니다.', true);
    } finally {
      loading = false;
      prevBtn.disabled = page <= 1;
      nextBtn.disabled = page >= totalPages;
    }
  }

  // 10개를 한 슬라이드로 그리고, 이동 방향에 맞게 애니메이션
  function render(hits, direction) {
    const items = hits.map(h => {
      const a = document.createElement('a');
      a.href = h.pageURL;
      a.target = '_blank';
      a.rel = 'noopener';
      const img = document.createElement('img');
      img.src = h.webformatURL;
      img.alt = h.tags;
      img.loading = 'lazy';
      const cap = document.createElement('span');
      cap.textContent = h.tags;
      a.append(img, cap);
      return a;
    });
    slideEl.replaceChildren(...items);
    slideEl.className = 'slide ' + (direction === 'prev' ? 'in-left' : 'in-right');
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    query = qInput.value.trim();
    if (!query) return;
    page = 1;
    load(1, 'next');
  });
  prevBtn.addEventListener('click', () => load(page - 1, 'prev'));
  nextBtn.addEventListener('click', () => load(page + 1, 'next'));
</script>
</body>
</html>
